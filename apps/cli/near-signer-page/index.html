<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shelter signing</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <h1>Shelter signing request</h1>
    <p class="sub">Served by your local Shelter CLI. Nothing here sends a transaction.</p>
  </header>
  <p id="status" role="status" aria-live="polite" data-tone="info">Loading…</p>
  <section id="request" hidden>
    <h2 id="purpose"></h2>
    <ul id="summary"></ul>
    <dl>
      <dt>Account</dt><dd id="account" class="mono"></dd>
      <dt>Recipient</dt><dd id="recipient" class="mono"></dd>
      <dt>Nonce</dt><dd id="nonce" class="mono"></dd>
    </dl>
    <h3>Exact message to sign (NEP-413)</h3>
    <pre id="message" class="mono"></pre>
    <div class="actions">
      <button id="sign" type="button" disabled>Sign with Meteor</button>
      <button id="reject" type="button" class="secondary" disabled>Reject</button>
    </div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
